<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISSION CONTROL · make.fun ops terminal</title>
<meta name="description" content="A live operations terminal for make.fun: the bounty board, each bounty's briefing, its leaderboard and every account's public profile.">
<meta name="theme-color" content="#0a0e0d">
<link rel="icon" href="data:,">
<style>
/* Only what the first paint of the shell needs; rows and sub-pages bring their own styles. */
:root{--bg:#0a0e0d;--panel:#101715;--line:#1f2d28;--ink:#d3e6dd;--dim:#86a096;--go:#3dffa2;--warn:#ffc247;--hot:#ff6b5e;--link:#72d6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--go);outline-offset:1px}
small{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.bar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;min-height:42px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{color:var(--go);font-weight:700;letter-spacing:.08em}
.bar nav{display:flex;gap:14px;flex:1}
#net,.clock,.st{color:var(--dim);font-size:12px}
.bar .clock,.t{color:var(--warn);font-variant-numeric:tabular-nums}
#board,#view{padding:12px;min-width:0}
.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.hud>div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--go);padding:8px 10px;min-width:0}
.hud b,.hud time{display:block;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g{color:var(--go)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:0}
input{flex:1 100%;min-width:140px}
button{flex:1;cursor:pointer;color:var(--dim)}
button[aria-pressed=true]{color:var(--bg);background:var(--go);border-color:var(--go)}
.cols{display:none}
@media(min-width:620px){
.hud{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header class="bar">
<a class="brand" href="#/">▲ MISSION CONTROL</a>
<nav><a href="#/">BOARD</a><a href="https://make.fun" rel="noopener">make.fun ↗</a></nav>
<output id="net">NET 0 req</output>
<time class="clock">--:--:--Z</time>
</header>
<div class="deck">
<section id="board" aria-label="Bounty board: live pot, entry fee, time left, entries">
<div class="hud">
<div><small>Live bounties</small><b>—</b></div>
<div><small>Total live pot</small><b class="g">—</b></div>
<div><small>Entries logged</small><b>—</b></div>
<div><small>Next deadline</small><time class="t">—</time></div>
</div>
<div class="ctl">
<input type="search" placeholder="filter bounties…" aria-label="Filter bounties">
<button data-s="pot" aria-pressed="true">POT</button><button data-s="t" aria-pressed="false">TIME LEFT</button><button data-s="ent" aria-pressed="false">ENTRIES</button>
</div>
<div class="cols" aria-hidden="true"><span>BOUNTY</span><span>LIVE POT</span><span>ENTRY FEE</span><span>TIME LEFT</span><span>ENTRIES</span></div>
<div class="rows"></div>
<p class="st" role="status">ACQUIRING SIGNAL…</p>
</section>
<main id="view" tabindex="-1"></main>
</div>
<script type="module">import('./app.js');</script>
</body>
</html>
